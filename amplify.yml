version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - npm install
        build:
          commands:
            - npm run generate
      artifacts:
        baseDirectory: .output/public
        files:
          - "**/*"
      customHeaders:
        - pattern: "**/*"
          headers:
            - key: "Cache-Control"
              value: "public, max-age=0, s-maxage=0, must-revalidate"
    appRoot: Frontend
